[project]
name = "imem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zoushuqing", email = "szou5@dons.usfca.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.122.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.17.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "voyageai>=0.5.0",
]

[project.scripts]
imem = "imem.cli:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
